name: Windows installer

# Builds the packaged Windows app and the single-file installer.
#
# This repo is developed on a Mac, so the Windows build IS this workflow: it is where
# `IdahoHuntPlanner.exe` is produced, smoke-tested against its own `/api/health`, and
# wrapped by Inno Setup. Download the installer from the run's artifacts.
#
# Not a required check (the `main: require CI` ruleset requires only `test (3.12)`):
# a broken Windows build should never block an unrelated merge.

on:
  push:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"
      - "planner/**"
      - "static/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Build the app with PyInstaller
        run: pyinstaller --clean --noconfirm packaging/windows/planner.spec

      # Proof that the frozen exe actually runs on Windows: start it with no browser
      # and no IDFG download, then ask the app itself.
      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          $exe = "dist\IdahoHuntPlanner\IdahoHuntPlanner.exe"
          $env:IHP_DIR = "$env:RUNNER_TEMP\ihp-smoke"
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--no-browser","--no-fetch-regs","--port","5057" `
            -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\ihp-out.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\ihp-err.log"
          $body = $null
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            try {
              $body = Invoke-RestMethod -Uri "http://127.0.0.1:5057/api/health" -TimeoutSec 3
              if ($body.ok) { break }
            } catch { $body = $null }
          }
          Get-Content "$env:RUNNER_TEMP\ihp-out.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\ihp-err.log" -ErrorAction SilentlyContinue
          if (-not $body -or -not $body.ok) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "the packaged app never answered /api/health"
          }
          Write-Host "health: $($body | ConvertTo-Json -Compress)"
          # The map's own data has to be readable from the bundle, not just the health
          # endpoint: GMUs come from the seeded DB, the SVG from bundled static/.
          $units = Invoke-RestMethod -Uri "http://127.0.0.1:5057/api/units" -TimeoutSec 15
          Write-Host "units: $($units.units.Count)"
          if ($units.units.Count -lt 90) { throw "expected the seeded GMUs, got $($units.units.Count)" }
          $index = Invoke-WebRequest -Uri "http://127.0.0.1:5057/" -TimeoutSec 15
          if ($index.StatusCode -ne 200) { throw "the app did not serve its own index page" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      - name: Compile the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
          Get-ChildItem dist\installer

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: IdahoHuntPlanner-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Upload the unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: IdahoHuntPlanner-app
          path: dist/IdahoHuntPlanner
          if-no-files-found: error
